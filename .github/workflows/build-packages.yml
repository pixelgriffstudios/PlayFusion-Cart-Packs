name: Build and test Cart Packs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm base-devel git rust alsa-lib libx11 libxi mesa systemd-libs shellcheck
      - uses: actions/checkout@v4
      - name: Lock Rust dependencies
        run: cd ui && cargo generate-lockfile
      - name: Rust checks
        run: cd ui && cargo test --locked && cargo clippy --locked -- -D warnings
      - name: Shell checks
        run: shellcheck payload/common/usr/lib/playfusion-cart-packs/* payload/profiles/usr/bin/* payload/loose-media/usr/bin/* tests/*.sh
      - name: Disposable install and rollback tests
        run: bash tests/verify-source.sh
      - name: Build packages
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c "cd '$GITHUB_WORKSPACE' && makepkg --noconfirm --cleanbuild --nodeps"
      - name: Package inspection tests
        run: bash tests/verify-packages.sh
      - name: Generate checksums
        run: sha256sum ./*.pkg.tar.zst > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: playfusion-cart-packs
          path: '*.pkg.tar.zst'
      - name: Publish tagged release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
            SHA256SUMS.txt
